<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vakeel AI — Indian Legal Consultant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0f0a;
      font-family: Georgia, 'Times New Roman', serif;
      color: #e8e0d0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: rgba(10,15,10,0.95);
      border-bottom: 1px solid rgba(180,140,60,0.25);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, #b8860b, #daa520);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; box-shadow: 0 0 16px rgba(218,165,32,0.3);
    }
    .logo-text h1 { font-size: 1.1rem; color: #daa520; letter-spacing: 0.05em; }
    .logo-text p  { font-size: 0.68rem; color: #888; letter-spacing: 0.12em; text-transform: uppercase; }
    .status { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: #888; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; box-shadow: 0 0 8px #4caf50; animation: pulse 2s infinite; }

    /* ── Chat area ── */
    main {
      flex: 1;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0 16px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      margin-bottom: 20px;
      animation: fadeUp 0.3s ease;
    }
    .message.user  { justify-content: flex-end; }
    .message.bot   { justify-content: flex-start; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #b8860b, #daa520);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; margin-right: 10px; margin-top: 4px;
      box-shadow: 0 0 12px rgba(218,165,32,0.25);
    }

    .bubble {
      max-width: 78%;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 0.92rem;
      line-height: 1.75;
    }
    .message.user .bubble {
      background: linear-gradient(135deg, #1a3a1a, #1e4020);
      border: 1px solid rgba(76,175,80,0.3);
      border-radius: 18px 18px 4px 18px;
      color: #e8e0d0;
    }
    .message.bot .bubble {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(180,140,60,0.2);
      border-radius: 18px 18px 18px 4px;
      color: #e8e0d0;
    }

    /* Sources */
    .sources {
      margin-top: 10px;
      padding: 10px 14px;
      background: rgba(180,140,60,0.06);
      border: 1px solid rgba(180,140,60,0.15);
      border-radius: 10px;
      font-size: 0.78rem;
      color: #b8a070;
    }
    .sources strong { color: #daa520; display: block; margin-bottom: 4px; }
    .source-item { margin: 3px 0; padding-left: 8px; border-left: 2px solid rgba(180,140,60,0.3); }

    /* Typing indicator */
    .typing { display: flex; gap: 5px; padding: 14px 18px; align-items: center; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%;
      background: #daa520; opacity: 0.7;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    /* Quick questions */
    #quick-qs {
      padding: 8px 0 16px;
    }
    #quick-qs p { font-size: 0.7rem; color: #555; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
    .quick-btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .quick-btn {
      background: transparent;
      border: 1px solid rgba(180,140,60,0.3);
      border-radius: 20px;
      padding: 6px 14px;
      color: #b8a070;
      font-size: 0.78rem;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .quick-btn:hover { background: rgba(180,140,60,0.1); border-color: #daa520; color: #daa520; }

    /* Input area */
    #input-area {
      border-top: 1px solid rgba(180,140,60,0.15);
      padding: 12px 0 20px;
      background: rgba(10,15,10,0.95);
    }
    .input-box {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(180,140,60,0.3);
      border-radius: 16px;
      padding: 10px 12px;
    }
    .upload-btn {
      background: transparent; border: none; cursor: pointer;
      color: #888; font-size: 20px; padding: 4px 6px;
      transition: color 0.2s; flex-shrink: 0; line-height: 1;
    }
    .upload-btn:hover { color: #daa520; }
    #query-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: #e8e0d0; font-size: 0.92rem; font-family: Georgia, serif;
      resize: none; line-height: 1.6; max-height: 120px; overflow-y: auto;
    }
    #query-input::placeholder { color: #555; }
    #send-btn {
      background: linear-gradient(135deg, #b8860b, #daa520);
      border: none; border-radius: 10px; padding: 8px 18px;
      color: #0a0f0a; font-weight: bold; font-family: inherit;
      cursor: pointer; font-size: 0.85rem; flex-shrink: 0;
      transition: opacity 0.2s; letter-spacing: 0.04em;
    }
    #send-btn:disabled { opacity: 0.4; cursor: default; }
    #disclaimer {
      text-align: center; font-size: 0.67rem; color: #444; margin-top: 8px;
    }

    /* PDF badge */
    #pdf-badge {
      display: none;
      background: rgba(218,165,32,0.08);
      border: 1px solid rgba(218,165,32,0.3);
      border-radius: 8px; padding: 8px 14px; margin-bottom: 8px;
      justify-content: space-between; align-items: center;
      font-size: 0.82rem; color: #daa520;
    }
    #pdf-badge button { background: none; border: none; color: #888; cursor: pointer; font-size: 16px; }

    /* Error banner */
    .error-msg { color: #ff6b6b; font-size: 0.85rem; padding: 8px 0; }

    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0);} 40%{transform:translateY(-8px);} }
    @keyframes pulse  { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(180,140,60,0.3); border-radius: 2px; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">⚖️</div>
    <div class="logo-text">
      <h1>VAKEEL AI</h1>
      <p>Indian Legal Consultant</p>
    </div>
  </div>
  <div class="status">
    <div class="dot"></div>
    <span id="status-text">Connecting...</span>
  </div>
</header>

<main>
  <div id="messages">
    <!-- Messages rendered here -->
  </div>

  <div id="quick-qs">
    <p>Common Cases</p>
    <div class="quick-btns">
      <button class="quick-btn" onclick="setQuery('My employer hasn\'t paid salary for 2 months')">Unpaid salary</button>
      <button class="quick-btn" onclick="setQuery('Landlord refusing to return security deposit')">Security deposit</button>
      <button class="quick-btn" onclick="setQuery('I received a bounced cheque, what action can I take?')">Cheque bounce</button>
      <button class="quick-btn" onclick="setQuery('Neighbour encroaching on my property')">Property dispute</button>
    </div>
  </div>

  <div id="input-area">
    <div id="pdf-badge">
      <span>📄 <span id="pdf-name"></span></span>
      <button onclick="removePDF()">✕</button>
    </div>
    <div class="input-box">
      <button class="upload-btn" title="Upload PDF" onclick="document.getElementById('pdf-input').click()">📎</button>
      <input type="file" id="pdf-input" accept=".pdf" style="display:none" onchange="handlePDF(this)"/>
      <textarea id="query-input" rows="1" placeholder="Describe your legal situation... (Shift+Enter for new line)"
        oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
      <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
    <p id="disclaimer">For guidance only · Consult a registered advocate for court matters</p>
  </div>
</main>

<script>
  const API = 'http://localhost:8000';
  let pdfFile = null;
  let isLoading = false;

  // ── On load ──────────────────────────────────────────
  window.onload = async () => {
    await checkHealth();
    addBotMessage(
      "Namaskar! I'm **Vakeel AI**, your personal Indian legal consultant. 🏛️\n\n" +
      "You can describe your legal situation, ask about any Indian law, or upload a legal document (PDF) for analysis.\n\n" +
      "Tell me — what legal matter can I help you with today?",
      []
    );
  };

  async function checkHealth() {
    try {
      const res = await fetch(`${API}/health`);
      if (res.ok) {
        document.getElementById('status-text').textContent = 'Online';
        document.querySelector('.dot').style.background = '#4caf50';
      }
    } catch {
      document.getElementById('status-text').textContent = 'API Offline — start the server';
      document.querySelector('.dot').style.background = '#ff6b6b';
    }
  }

  // ── Send message ─────────────────────────────────────
  async function sendMessage() {
    if (isLoading) return;
    const input = document.getElementById('query-input');
    const query = input.value.trim();
    if (!query && !pdfFile) return;

    // Hide quick questions after first message
    document.getElementById('quick-qs').style.display = 'none';

    // Add user message
    addUserMessage(query || '📄 Document uploaded for analysis');
    input.value = '';
    input.style.height = 'auto';

    isLoading = true;
    document.getElementById('send-btn').disabled = true;

    // Show typing indicator
    const typingId = addTyping();

    try {
      let data;

      if (pdfFile) {
        // PDF upload endpoint
        const formData = new FormData();
        formData.append('file', pdfFile);
        const res = await fetch(`${API}/upload-pdf`, {
          method: 'POST', body: formData
        });
        if (!res.ok) throw new Error(await res.text());
        const json = await res.json();
        data = { answer: json.legal_advice, sources: [] };
        removePDF();

      } else {
        // Chat endpoint
        const res = await fetch(`${API}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, top_k: 5 })
        });
        if (!res.ok) throw new Error(await res.text());
        data = await res.json();
      }

      removeTyping(typingId);
      addBotMessage(data.answer, data.sources || []);

    } catch (err) {
      removeTyping(typingId);
      addBotMessage(
        '❌ Could not connect to Vakeel AI server.\n\nMake sure the FastAPI server is running:\n`python src/api/main.py`',
        []
      );
    }

    isLoading = false;
    document.getElementById('send-btn').disabled = false;
  }

  // ── Message rendering ─────────────────────────────────
  function addUserMessage(text) {
    const div = document.createElement('div');
    div.className = 'message user';
    div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
    document.getElementById('messages').appendChild(div);
    scrollBottom();
  }

  function addBotMessage(text, sources) {
    const div = document.createElement('div');
    div.className = 'message bot';

    // Format markdown-like text
    let formatted = escapeHtml(text)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/`(.+?)`/g, '<code style="background:#1a2a1a;padding:2px 5px;border-radius:3px;font-family:monospace;color:#7fff7f">$1</code>')
      .replace(/\n/g, '<br>');

    // Build sources HTML
    let sourcesHtml = '';
    if (sources && sources.length > 0) {
      const topSources = sources.slice(0, 3);
      sourcesHtml = `
        <div class="sources">
          <strong>📚 Sources Retrieved</strong>
          ${topSources.map(s => `
            <div class="source-item">
              ${s.act_name || s.court || s.source} 
              ${s.section_id ? '· ' + s.section_id : ''}
              <span style="color:#666;float:right">${(s.score * 100).toFixed(0)}%</span>
            </div>
          `).join('')}
        </div>`;
    }

    div.innerHTML = `
      <div class="avatar">⚖️</div>
      <div>
        <div class="bubble">${formatted}</div>
        ${sourcesHtml}
      </div>`;

    document.getElementById('messages').appendChild(div);
    scrollBottom();
  }

  function addTyping() {
    const id = 'typing-' + Date.now();
    const div = document.createElement('div');
    div.className = 'message bot';
    div.id = id;
    div.innerHTML = `
      <div class="avatar">⚖️</div>
      <div class="bubble typing">
        <span></span><span></span><span></span>
      </div>`;
    document.getElementById('messages').appendChild(div);
    scrollBottom();
    return id;
  }

  function removeTyping(id) {
    document.getElementById(id)?.remove();
  }

  // ── PDF handling ──────────────────────────────────────
  function handlePDF(input) {
    pdfFile = input.files[0];
    if (!pdfFile) return;
    document.getElementById('pdf-name').textContent = pdfFile.name;
    document.getElementById('pdf-badge').style.display = 'flex';
    document.getElementById('query-input').placeholder = 'Add a question about this document (optional)';
  }

  function removePDF() {
    pdfFile = null;
    document.getElementById('pdf-input').value = '';
    document.getElementById('pdf-badge').style.display = 'none';
    document.getElementById('query-input').placeholder = 'Describe your legal situation...';
  }

  // ── Helpers ───────────────────────────────────────────
  function setQuery(text) {
    document.getElementById('query-input').value = text;
    document.getElementById('query-input').focus();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function scrollBottom() {
    const msgs = document.getElementById('messages');
    msgs.scrollTop = msgs.scrollHeight;
  }

  function escapeHtml(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }
</script>
</body>
</html>
